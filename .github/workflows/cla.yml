name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/feepenna/Tribuna-Sicura/blob/main/CLA.md
          # Assinaturas ficam numa branch própria para não poluir main nem esbarrar em branch protection
          branch: cla-signatures
          path-to-signatures: signatures/v1/cla.json
          allowlist: feepenna,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: |
            Obrigado pela contribuição! Antes de aceitarmos o seu pull request, pedimos que você leia e assine o nosso [Contrato de Licença de Contribuidor (CLA)](https://github.com/feepenna/Tribuna-Sicura/blob/main/CLA.md). Para assinar, comente neste PR exatamente a frase abaixo:
          custom-allsigned-prcomment: Todos os contribuidores assinaram o CLA. ✅
